# Render Blueprint — Backend (GoalForge API)
# Deploy this repo ("VaultApi") as a Blueprint on Render.
# Docs: https://render.com/docs/blueprint-spec
#
# NOTE on the database:
# - The managed Postgres below works out of the box on the free plan.
# - Render's FREE Postgres EXPIRES after 30 days and the data is deleted.
# - For a permanent free database, create one on https://neon.tech (free tier),
#   then remove the "databases:" block below and set DATABASE_URL manually
#   to your Neon connection string (leave DATABASE_USERNAME/PASSWORD empty).

services:
  - type: web
    name: goalforge
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      # Frontend origin(s), comma separated. Add every deployed frontend:
      # Render: https://goalforge-ui.onrender.com  /  Vercel: https://goal-forge-frontend.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,https://goal-forge-frontend.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: goalforge-db
          property: jdbcString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: goalforge-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: goalforge-db
          property: password
      - key: FRONTEND_URL
        value: https://goalforge-ui.onrender.com
      # Gmail SMTP app password. Leave empty to disable sending reset emails.
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

databases:
  - name: goalforge-db
    databaseName: goalforge
    user: goalforge
    plan: free
